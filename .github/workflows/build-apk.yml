name: Build Mi apptaxi 🐼 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools cython

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Configure python-for-android
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          lines = text.splitlines()
          new_lines = []

          found_p4a = False

          for line in lines:
              if line.strip().startswith("p4a.branch"):
                  new_lines.append("p4a.branch = develop")
                  found_p4a = True
              else:
                  new_lines.append(line)

          if not found_p4a:
              new_lines.append("")
              new_lines.append("p4a.branch = develop")

          path.write_text("\n".join(new_lines) + "\n")

          print("p4a.branch configurado como develop.")
          PY

          grep -n "p4a.branch" buildozer.spec

      - name: Prepare python-for-android
        run: |
          buildozer android p4a -- --help

          P4A_DIR=$(find .buildozer/android/platform -type d -name "python-for-android" | head -n 1)

          echo "P4A_DIR=$P4A_DIR"

          if [ -z "$P4A_DIR" ]; then
            echo "ERROR: No se encontró python-for-android"
            exit 1
          fi

          echo "Eliminando receta problemática de ReportLab..."

          rm -rf "$P4A_DIR/pythonforandroid/recipes/reportlab"

          echo "Receta ReportLab eliminada."

      - name: Configure requirements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          lines = text.splitlines()
          new_lines = []

          found = False

          for line in lines:
              if line.strip().startswith("requirements ="):
                  new_lines.append(
                      "requirements = python3,kivy,pyjnius,reportlab,pillow"
                  )
                  found = True
              else:
                  new_lines.append(line)

          if not found:
              raise SystemExit(
                  "ERROR: No se encontró la línea requirements en buildozer.spec"
              )

          path.write_text("\n".join(new_lines) + "\n")

          print("requirements configurado correctamente.")
          PY

          grep -n "requirements =" buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Verify ReportLab is inside APK
        run: |
          echo "APK generado:"
          ls -lh bin/*.apk

          echo ""
          echo "Buscando ReportLab dentro del APK..."

          unzip -l bin/*.apk | grep -i "reportlab" | head -30 || true

          if unzip -l bin/*.apk | grep -qi "reportlab"; then
            echo ""
            echo "✅ REPORTLAB ESTA DENTRO DEL APK"
          else
            echo ""
            echo "❌ REPORTLAB NO ESTA DENTRO DEL APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-apptaxi-APK
          path: bin/*.apk
          if-no-files-found: error
